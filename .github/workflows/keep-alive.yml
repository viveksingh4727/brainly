name: Keep Render backend alive

# Render's free tier spins the service down after ~15 min of inactivity.
# This pings the /health endpoint on a schedule so it stays warm.

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load,
    # so 10 min gives headroom under Render's ~15 min idle window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://brainly-1-b894.onrender.com/health")
          echo "Health check returned HTTP $code"
          if [ "$code" -ne 200 ]; then
            exit 1
          fi
